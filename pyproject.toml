[project]
name = "screening-anomaly-detection"
version = "0.1.0"
description = "Robust drop anomaly detection for sanctions screening hit rate data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "pipelines"]
